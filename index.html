
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validação de Ingressos - Circuito Nacional do Livro Maçônico</title>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #173653;
      text-align: center;
    }

    .painel {
      max-width: 460px;
      margin: auto;
      padding: 20px 14px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 14px #00000018;
    }

    h1 {
      font-size: 21px;
      line-height: 1.4;
    }

    h2 { font-size: 17px; }

    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }

    input {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: 1px solid #a5b0bd;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
    }

    #leitor {
      width: 100%;
      margin: 18px auto;
      border-radius: 8px;
      overflow: hidden;
    }

    button {
      background: #173653;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 18px;
      margin: 6px 3px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #resultado {
      margin: 18px 0;
      padding: 20px 12px;
      border-radius: 10px;
      background: #edf0f3;
      font-size: 21px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    #resultado.verde {
      background: #188343;
      color: white;
    }

    #resultado.vermelho {
      background: #bf2525;
      color: white;
    }

    #resultado.amarelo {
      background: #f5d36d;
      color: #453500;
    }

    #detalhes {
      font-size: 16px;
      margin-top: 10px;
      font-weight: normal;
    }

    .aviso {
      font-size: 13px;
      line-height: 1.5;
      color: #666;
    }
  </style>
</head>
<body>
  <main class="painel">
    <h1>CIRCUITO NACIONAL DO LIVRO MAÇÔNICO</h1>
    <h2>Controle de entrada</h2>

    <label for="pin">PIN do operador</label>
    <input
      id="pin"
      type="password"
      inputmode="numeric"
      maxlength="12"
      autocomplete="off"
      placeholder="Digite o PIN de 12 dígitos"
    >

    <div id="leitor"></div>

    <div id="resultado">
      Aguardando leitura
      <div id="detalhes"></div>
    </div>

    <button id="iniciar" onclick="iniciarCamera()">
      Iniciar câmera
    </button>

    <button id="novo" onclick="lerOutro()" disabled>
      Ler próximo ingresso
    </button>

    <p class="aviso">
      Aponte a câmera para o QR Code.
      A leitura é automática.
    </p>

    <p class="aviso">
      O ingresso somente será autorizado após
      a confirmação do servidor.
    </p>
  </main>

  <script>
    // O endereço será configurado após os testes de segurança.
    // Nunca coloque o PIN neste campo.
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycby5owqt6nz5p0Z1-fUh7aPEostuTDyLmZaeg1x3z024zI-7pe9iF777KRWKZjPCsnf_0g/exec";

    let leitor = null;
    let bloqueado = false;
    let audio = null;

    const campoPin = document.getElementById("pin");
    const painelResultado = document.getElementById("resultado");
    const detalhes = document.getElementById("detalhes");
    const botaoIniciar = document.getElementById("iniciar");
    const botaoNovo = document.getElementById("novo");

    function mostrar(tipo, mensagem, detalhe = "") {
      painelResultado.className = tipo;
      painelResultado.firstChild.textContent = mensagem;
      detalhes.textContent = detalhe;
    }

    function prepararSom() {
      try {
        const AudioContexto =
          window.AudioContext || window.webkitAudioContext;

        if (AudioContexto && !audio) {
          audio = new AudioContexto();
        }

        if (audio && audio.state === "suspended") {
          audio.resume();
        }
      } catch (erro) {
        // O leitor visual continua funcionando sem áudio.
      }
    }

    function tocarSom(tipo) {
      if (!audio) return;

      const frequencias =
        tipo === "verde" ? [880] :
        tipo === "vermelho" ? [330, 260] : [];

      frequencias.forEach((frequencia, indice) => {
        const inicio =
          audio.currentTime + indice * 0.22;

        const oscilador = audio.createOscillator();
        const volume = audio.createGain();

        oscilador.type = "sine";
        oscilador.frequency.value = frequencia;

        volume.gain.setValueAtTime(0.001, inicio);
        volume.gain.exponentialRampToValueAtTime(
          0.13, inicio + 0.02
        );
        volume.gain.exponentialRampToValueAtTime(
          0.001, inicio + 0.17
        );

        oscilador.connect(volume);
        volume.connect(audio.destination);

        oscilador.start(inicio);
        oscilador.stop(inicio + 0.18);
      });
    }

    function concluir(resultado) {
      if (resultado.ok === true) {
        mostrar(
          "verde",
          "ENTRADA AUTORIZADA",
          resultado.numero
            ? "Ingresso nº " + resultado.numero
            : "Ingresso validado"
        );

        tocarSom("verde");
      } else if (
        resultado.mensagem &&
        (
          resultado.mensagem.includes("MODO DE TESTE") ||
          resultado.mensagem.includes("ERRO NA VALIDAÇÃO")
        )
      ) {
        mostrar(
          "amarelo",
          "VALIDAÇÃO NÃO CONCLUÍDA",
          resultado.mensagem
        );
      } else {
        mostrar(
          "vermelho",
          "ENTRADA NEGADA",
          resultado.mensagem || "Ingresso não autorizado"
        );

        tocarSom("vermelho");
      }

      botaoNovo.disabled = false;
    }

    function consultarResultado(id) {
      return new Promise((resolve, reject) => {
        let tentativas = 0;

        function consultar() {
          tentativas++;

          if (tentativas > 10) {
            reject(new Error(
              "Não foi possível confirmar a validação."
            ));
            return;
          }

          const url = new URL(URL_APPS_SCRIPT);
          url.searchParams.set("acao", "resultado");
          url.searchParams.set("requisicao", id);
          url.searchParams.set("t", Date.now());

          const script = document.createElement("script");
          let resposta = null;

          window.receberResultadoQR = function(dados) {
            resposta = dados;
          };

          script.src = url.toString();

          script.onload = function() {
            script.remove();

            if (resposta && resposta.pendente !== true) {
              resolve(resposta);
            } else {
              setTimeout(consultar, 800);
            }
          };

          script.onerror = function() {
            script.remove();
            setTimeout(consultar, 800);
          };

          document.head.appendChild(script);
        }

        consultar();
      });
    }

    async function enviarValidacao(codigo) {
      const pin = campoPin.value.trim();

      if (!/^\d{12}$/.test(pin)) {
        mostrar(
          "amarelo",
          "PIN NECESSÁRIO",
          "Informe os 12 dígitos do PIN."
        );
        botaoNovo.disabled = false;
        return;
      }

      if (!URL_APPS_SCRIPT) {
        mostrar(
          "amarelo",
          "INTEGRAÇÃO PENDENTE",
          "O endereço do servidor ainda não foi configurado."
        );
        botaoNovo.disabled = false;
        return;
      }

      mostrar(
        "amarelo",
        "AGUARDANDO VALIDAÇÃO",
        "Consultando o Google Sheets..."
      );

      const requisicao = crypto.randomUUID();

      try {
        await fetch(URL_APPS_SCRIPT, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=UTF-8"
          },
          body: JSON.stringify({
            requisicao: requisicao,
            pin: pin,
            codigo: codigo
          })
        });

        const resposta =
          await consultarResultado(requisicao);

        concluir(resposta);

      } catch (erro) {
        mostrar(
          "amarelo",
          "CONFIRMAÇÃO INDISPONÍVEL",
          "Verifique o registro na planilha antes de tentar novamente."
        );

        botaoNovo.disabled = false;
      }
    }

    async function iniciarCamera() {
      prepararSom();

      botaoIniciar.disabled = true;

      mostrar(
        "",
        "INICIANDO CÂMERA",
        "Aguarde..."
      );

      try {
        if (typeof Html5Qrcode === "undefined") {
          throw new Error("Biblioteca de leitura indisponível.");
        }

        if (!leitor) {
          leitor = new Html5Qrcode("leitor");
        }

        await leitor.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: (largura, altura) => {
              const lado = Math.min(
                240,
                Math.floor(Math.min(largura, altura) * 0.7)
              );

              return {
                width: lado,
                height: lado
              };
            }
          },
          codigo => {
            if (bloqueado) return;

            bloqueado = true;
            leitor.pause(true);
            botaoNovo.disabled = true;

            enviarValidacao(codigo);
          },
          () => {
            // Aguarda a identificação de um QR Code.
          }
        );

        mostrar(
          "",
          "CÂMERA ATIVA",
          "Aponte para o ingresso."
        );

      } catch (erro) {
        mostrar(
          "amarelo",
          "ERRO NA CÂMERA",
          erro.message
        );
        botaoIniciar.disabled = false;
      }
    }

    function lerOutro() {
      prepararSom();

      if (!leitor) return;

      try {
        leitor.resume();
        bloqueado = false;
        botaoNovo.disabled = true;

        mostrar(
          "",
          "CÂMERA ATIVA",
          "Aponte para o próximo ingresso."
        );

      } catch (erro) {
        mostrar(
          "amarelo",
          "ERRO",
          erro.message
        );
      }
    }
  </script>
</body>
</html>
